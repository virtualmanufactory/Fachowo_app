spring:
  application:
    name: fachowo
  datasource:
    url: jdbc:postgresql://localhost:5433/fachowo
    username: fachowo
    password: fachowo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Warsaw
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: default
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 300000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

server:
  port: 8080

jwt:
  secret: fachowo-dev-secret-key-must-be-at-least-256-bits-long!!
  expiration-ms: 86400000

app:
  cors:
    origins: http://localhost:5173
  auth:
    expose-reset-token: true
  registry:
    stub: true
    ceidg-token: ${CEIDG_API_TOKEN:}
  storage:
    endpoint: http://localhost:9000
    public-url: http://localhost:9000
    access-key: fachowo
    secret-key: fachowo123
    bucket: fachowo
    region: us-east-1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
