services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fachowo
      POSTGRES_USER: fachowo
      POSTGRES_PASSWORD: fachowo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fachowo -d fachowo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fachowo
      MINIO_ROOT_PASSWORD: fachowo123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 fachowo fachowo123;
      mc mb -p local/fachowo;
      mc anonymous set download local/fachowo;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
